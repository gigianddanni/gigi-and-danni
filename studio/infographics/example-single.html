<!DOCTYPE html>
<!--
  Single-graphic starter. Copy to studio/infographics/<slug>.html and edit.
  Render:  python3 .claude/skills/content-studio/scripts/render.py \
             studio/infographics/<slug>.html --preset portrait

  The stylesheet path assumes the file lives in studio/infographics/.
  Default ground is light (the house look). Add class="dark" to .canvas
  for the inverted variant.
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Infographic</title>
  <link rel="stylesheet" href="../../.claude/skills/content-studio/assets/brand.css">
</head>
<body>
  <div class="canvas">
    <div class="body">
      <div class="eyebrow">AI Receptionists</div>
      <h1 class="hero">Never miss <span class="accent">another job.</span></h1>
      <p class="sub">Your phone answered 24/7, in your business's name — every lead texted to you before the caller hangs up.</p>
    </div>

    <div class="mark">
      <span>Gigi <span class="amp">&amp;</span> Danni</span>
      <span class="page">gigianddanni.com</span>
    </div>
  </div>
</body>
</html>
